plugins {
    id 'java'
}

group = 'com.maine'
version = '1.2.0'

repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Paper 26.2, build #134. Gson comes with Paper; the SQLite driver is downloaded by Paper at
    // startup (see "libraries" in plugin.yml), so nothing needs to be shaded into the jar.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.134-stable'
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.27'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.134-stable'
    testImplementation 'de.maxhenkel.voicechat:voicechat-api:2.5.27'
}

test {
    useJUnitPlatform()
    inputs.property('voiceSimulationUrl', providers.environmentVariable('POMI_VOICE_SIM_URL').orElse(''))
}

java {
    // Minecraft 26.x runs on Java 25.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.version]
    inputs.properties props
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    archiveFileName = "Pomi-${project.version}.jar"
}
