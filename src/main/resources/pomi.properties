# Configuración de Pomi (plugin). Se copia a plugins/Pomi/config.properties la primera vez.
# Después de editarla usa /p recargar.

# Clave de xAI (Grok) para que Pomi platique: https://console.x.ai/
# Si la dejas vacía se usa la variable de entorno XAI_API_KEY del servidor (recomendado, así la
# clave no queda en un archivo). Sin clave, Pomi obedece comandos pero no platica.
xai-api-key=

# Modelo de Grok (el mismo que usa el mod por defecto).
model=grok-4.20-0309-non-reasoning

# Personalidad extra que se suma a la de Pomi (opcional), por ejemplo: menos sarcástica.
personalidad=

# Pomi recuerda datos de cada jugador (en plugins/Pomi/memoria.db).
memoria=true

# Pomi comenta con Grok lo que pasa (logros, mobs derrotados, tareas terminadas). Cada comentario
# es una llamada a la API; con false solo avisa con un mensaje corto.
comentarios-ia=true

# Segundos mínimos entre mensajes de un mismo jugador a Pomi.
espera-mensajes=2

# Solo romper bloques naturales (tierra, piedra, troncos...), nunca construcciones de nadie.
solo-bloques-naturales=true


# Voz de Pomi: la app de escritorio "Pomi Voz" lee en voz alta todo lo que Pomi dice. El jugador
# escribe /p voz, y pone en la app la dirección que le sale y el código. Requiere reiniciar.
voz=true
# Puerto HTTP para la app. Ábrelo en el firewall (TCP) igual que el del juego.
voz-puerto=8765
# Servidor Kokoro (texto a voz, API compatible con OpenAI). El servidor lo llama, no los jugadores.
kokoro-url=http://intranet.owldesarrollos.com:8880/v1/audio/speech
kokoro-voz=ef_dora
kokoro-velocidad=0.95
# Whisper (voz a texto, API compatible con OpenAI, p. ej. speaches) para las órdenes de voz de la app:
# el jugador dice "Oye Pomi, consigue madera" y se ejecuta como /p consigue madera. Vacío = sin oído.
whisper-url=http://intranet.owldesarrollos.com:8881/v1/audio/transcriptions
whisper-modelo=Systran/faster-whisper-small
